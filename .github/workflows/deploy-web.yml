name: Build web app into main

# Hostinger's git integration clones this repository and serves the result. It
# never runs a build, and app/dist/ is gitignored — so what it deployed was pure
# source with no index.html at its root, and Apache answers a directory with no
# index and no listing with 403. That is the error.
#
# Deploying from a separate branch would fix it too, but it requires repointing
# hPanel at that branch. Publishing into `main` instead means Hostinger's
# existing configuration already serves a working site: no branch change, no
# install-path change, nothing to reconfigure.
#
# The trade-off, accepted deliberately: the built site is committed to the root
# of `main`, so main carries build artifacts and its root holds both the site
# and the source. app/public/.htaccess denies HTTP access to the source
# directories that end up alongside it.

on:
  push:
    branches: [main]
    # Only source changes should trigger a rebuild. This is also the guard
    # against recursion: the commit this workflow makes touches root paths
    # (index.html, _expo/**, the manifest) and never app/**, so it cannot
    # retrigger itself. GitHub additionally suppresses workflow runs for pushes
    # authenticated with GITHUB_TOKEN, so there are two independent guards.
    paths:
      - "app/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: write

# One publish at a time. Not cancelling mid-run: this pushes a commit, and
# interrupting between build and push leaves nothing useful behind anyway.
concurrency:
  group: publish-web
  cancel-in-progress: false

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          # Full history so a rebase against a concurrent push can succeed.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build static web bundle
        working-directory: app
        env:
          # Set the repository VARIABLE WEB_BASE_PATH (Settings > Secrets and
          # variables > Actions > Variables) when Hostinger serves the clone
          # from a subfolder of the document root rather than the root itself.
          # Expo writes absolute asset URLs, so a wrong value here renders a
          # blank page with 404s for the JS bundle rather than an obvious error.
          WEB_BASE_PATH: ${{ vars.WEB_BASE_PATH }}
        run: |
          if [ -z "${WEB_BASE_PATH:-}" ]; then
            echo "::notice::WEB_BASE_PATH not set — building for the domain root."
          else
            echo "::notice::Building for subpath ${WEB_BASE_PATH}"
          fi
          npm run build

      - name: Verify build output
        run: |
          test -f app/dist/index.html || { echo "::error::app/dist/index.html missing — refusing to publish"; exit 1; }
          test -f app/dist/.htaccess  || { echo "::error::app/dist/.htaccess missing — source would be web-readable"; exit 1; }
          echo "Asset URLs baked into index.html:"
          grep -oE '(src|href)="[^"]*"' app/dist/index.html | sed 's/^/  /'

      - name: Publish build output to the root of main
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Remove the files published by the previous run so that renamed or
          # deleted assets (bundle filenames are content-hashed, so they change
          # on every source edit) don't accumulate in the web root forever.
          MANIFEST=.web-build-manifest
          if [ -f "$MANIFEST" ]; then
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              git rm -q --ignore-unmatch -- "$f" || true
            done < "$MANIFEST"
          fi

          # Copy the build to the repository root, which is what Hostinger's
          # clone exposes as the served directory.
          cp -R app/dist/. .

          # Record exactly what was published, for the next run's cleanup.
          ( cd app/dist && find . -type f -printf '%P\n' | LC_ALL=C sort ) > "$MANIFEST"
          echo "Published $(wc -l < "$MANIFEST") files to the repository root."

          git add -A

          if git diff --cached --quiet; then
            echo "Build output is unchanged; nothing to commit."
            exit 0
          fi

          git commit -q -m "Build web app from ${GITHUB_SHA::7} [skip ci]"

          # A human push can land between checkout and push; rebase and retry
          # rather than failing the deploy.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}) — rebasing onto origin/main."
            git pull --rebase --autostash origin main
          done

          echo "::error::Could not push after 3 attempts."
          exit 1

      - name: What happens next
        env:
          WEB_BASE_PATH: ${{ vars.WEB_BASE_PATH }}
        run: |
          echo "main now contains the built site at its root, so Hostinger's"
          echo "existing git configuration serves it — branch stays 'main' and"
          echo "the install path is unchanged."
          echo
          echo "Trigger a deploy in hPanel (or via its auto-deploy webhook) so"
          echo "Hostinger pulls this commit."
          echo
          if [ -z "${WEB_BASE_PATH:-}" ]; then
            echo "  WEB_BASE_PATH: (unset) -> built for the domain root."
          else
            echo "  WEB_BASE_PATH: ${WEB_BASE_PATH} -> expect the site at"
            echo "  https://<yourdomain>${WEB_BASE_PATH}/"
          fi
          echo
          echo "After deploying, verify the source is NOT reachable:"
          echo "  curl -so /dev/null -w '%{http_code}\\n' https://<yourdomain>/supabase/schema.sql"
          echo "Anything other than 403 means .htaccess is not being applied."
