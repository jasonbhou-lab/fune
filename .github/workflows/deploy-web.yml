name: Publish web build to deploy branch

# Hostinger's git integration clones this repository but never runs a build, and
# app/dist/ is gitignored — so nothing it deployed ever contained an index.html,
# and Apache answered every request with 403.
#
# This builds the app and commits the output to a dedicated `deploy` branch,
# which has index.html at its root. Hostinger's existing git integration is then
# pointed at `deploy` instead of `main`.
#
# Why not upload over FTP/FTPS: that requires storing hosting credentials as
# repository secrets. This route authenticates with the GITHUB_TOKEN that
# Actions provides automatically, so there is no credential to create, store,
# or rotate. `main` stays free of build artifacts — they exist only on `deploy`.

on:
  push:
    branches: [main]
    # server/ and supabase/ don't affect the static bundle.
    paths:
      - "app/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

# contents: write is required to push the deploy branch, and is the only
# permission this job gets.
permissions:
  contents: write

# Never publish twice concurrently. Not cancelling in progress is deliberate:
# interrupting the push can leave the branch with an index.html referencing a
# bundle that isn't there.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # `npm ci`, not `install`, so the build uses exactly the locked dependency
      # tree and cannot silently pull a new transitive version.
      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build static web bundle
        working-directory: app
        env:
          # Hostinger's Git tool clones into a SUBFOLDER of the document root,
          # so the site is served from e.g. https://example.com/glp/. An Expo
          # export writes absolute asset URLs, which would resolve against the
          # domain root and 404 — a blank white page. app.config.js turns this
          # into experiments.baseUrl so those URLs carry the subpath.
          #
          # Set the repository variable WEB_BASE_PATH (Settings > Secrets and
          # variables > Actions > Variables) to the subfolder name, e.g. "/glp".
          # It is not a secret, which is why it is a variable rather than one.
          # Leave it unset only if the site is ever served from the domain root.
          WEB_BASE_PATH: ${{ vars.WEB_BASE_PATH }}
        run: |
          if [ -z "${WEB_BASE_PATH:-}" ]; then
            echo "::warning::WEB_BASE_PATH is not set — building for the domain root. If Hostinger serves this from a subfolder, the page will load blank with 404s for the JS bundle."
          else
            echo "Building for subpath: $WEB_BASE_PATH"
          fi
          npm run build

      # The subpath is baked into the HTML at build time, so a mismatch between
      # it and the folder Hostinger actually serves from is silent at deploy
      # time and only shows up as a blank page. Surface it in the log instead.
      - name: Report the subpath baked into the build
        working-directory: app
        run: |
          echo "Asset URLs in the built index.html:"
          grep -oE '(src|href)="[^"]*"' dist/index.html | sed 's/^/  /'

      # Gates on the exact condition that caused the original 403.
      - name: Verify build output
        run: |
          test -f app/dist/index.html || { echo "::error::app/dist/index.html missing — refusing to publish"; exit 1; }
          test -f app/dist/.htaccess  || { echo "::error::app/dist/.htaccess missing — security headers would be absent"; exit 1; }
          echo "Build output:"
          ls -la app/dist/

      - name: Publish build output to deploy branch
        env:
          # Provided automatically by Actions; scoped to this repository and
          # expires when the job ends.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          WORK="$(mktemp -d)"

          git init -q "$WORK"
          cd "$WORK"
          git remote add origin "$REMOTE"

          # Build on top of the existing branch rather than force-pushing a
          # rewritten one, so Hostinger's `git pull` fast-forwards instead of
          # failing on a non-fast-forward update.
          if git fetch -q origin deploy; then
            git checkout -q -b deploy FETCH_HEAD
            # Clear tracked files so deletions propagate; leaves .git intact.
            git rm -rq --ignore-unmatch .
          else
            echo "deploy branch does not exist yet — creating it"
            git checkout -q -b deploy
          fi

          cp -R "$GITHUB_WORKSPACE/app/dist/." .

          # Belt and braces: the deploy branch is served as a web root, so a
          # stray .env or key must never reach it.
          rm -f .env .env.* *.pem *.key || true

          git add -A
          if git diff --cached --quiet; then
            echo "Build output is byte-identical to the current deploy branch; nothing to publish."
            exit 0
          fi

          git \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Build from ${GITHUB_SHA}"

          git push -q origin deploy
          echo "Published $(git rev-parse --short HEAD) to the deploy branch."

      - name: Next step
        run: |
          echo "In hPanel > Advanced > Git, change the BRANCH to 'deploy' and"
          echo "leave the install path alone — the existing path is already the"
          echo "document root, since that is where the earlier deploy put the"
          echo "source that Apache answered with 403."
          echo
          echo "Note that public_html is usually nested at"
          echo "  domains/<yourdomain>/public_html"
          echo "rather than sitting at the File Manager root."
